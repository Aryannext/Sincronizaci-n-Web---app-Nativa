name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Si llega un commit nuevo al mismo PR, se cancela la ejecución anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # Ninguna dependencia ejecuta scripts al instalarse...
      - run: npm ci --ignore-scripts
      # ...salvo el binario de PostgreSQL para Linux, que necesita recrear los
      # enlaces simbólicos de sus librerías (scripts/hydrate-symlinks.js)
      - run: npm rebuild @embedded-postgres/linux-x64
      # Levanta su propio PostgreSQL embebido: no necesita servicios externos
      - run: npm test

  frontend:
    name: Frontend (lint y build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      # oxlint instalado por npm ci (versión fijada en package-lock.json)
      - run: npm run lint -- --deny-warnings
      - run: npm run build
