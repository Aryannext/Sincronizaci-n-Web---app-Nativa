# Nginx dentro del contenedor web: sirve el panel y reenvía /api/ al contenedor de la API.
# El Nginx del servidor ya quitó el prefijo /sincronizacion (ver sincronizacion.conf).
server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Solo se llega aquí desde el Nginx del servidor, que ya puso la IP real del cliente:
        # se pasa tal cual para que la API (TRUST_PROXY=1) la use en el límite de peticiones
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        client_max_body_size 1m;
    }

    # Vite pone un hash en el nombre de cada archivo: se pueden guardar en caché para siempre
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
