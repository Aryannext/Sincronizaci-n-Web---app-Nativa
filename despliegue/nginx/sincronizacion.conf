# Sincronización dentro del sitio del portafolio. Se incluye en el bloque server 443 de proyectosena.online:
#     include /home/cristian/proyectos/proyectosena.online/sincronizacion/despliegue/nginx/sincronizacion.conf;
# ^~ impide que las location con expresiones regulares del portafolio atiendan rutas de /sincronizacion.
# El puerto 3020 debe coincidir con SINCRONIZACION_PUERTO de despliegue/.env.

location = /sincronizacion {
    return 301 /sincronizacion/;
}

# La APK firmada. No se versiona: cada versión se sube a mano con scp a esta carpeta, fuera del repositorio.
# Esta location es más larga que /sincronizacion/ y gana.
location ^~ /sincronizacion/descargas/ {
    alias /home/cristian/descargas-sincronizacion/;
    autoindex off;
    types { application/vnd.android.package-archive apk; text/plain sha256; }
    default_type application/octet-stream;
    add_header Content-Disposition attachment;
    add_header X-Content-Type-Options nosniff;
}

# Panel web y API: https://proyectosena.online/sincronizacion/ y https://proyectosena.online/sincronizacion/api/
location ^~ /sincronizacion/ {
    proxy_pass http://127.0.0.1:3020/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Se reemplaza, no se agrega: así nadie falsea su IP ante el límite de intentos del inicio de sesión
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1m;
    proxy_read_timeout 60s;
}
