# Sincronización en el VPS compartido. Lo despliega Dokploy en cada push a main; guía en el README
# ("Despliegue en Internet"). Los secretos van en el entorno de Dokploy, nunca en el repositorio.
name: sincronizacion

services:
  # Panel web compilado + proxy hacia la API. Es lo único que se publica, y solo para el Nginx del servidor:
  # https://proyectosena.online/sincronizacion/ (ver nginx/sincronizacion.conf)
  web:
    build:
      context: ..
      dockerfile: despliegue/web.Dockerfile
      args:
        VITE_BASE: /sincronizacion/
        VITE_API_URL: ${PANEL_API_URL:-https://proyectosena.online/sincronizacion}
    image: sincronizacion-web:actual
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    # El 127.0.0.1 no es decorativo: sin él, Docker abre el puerto a internet saltándose el cortafuegos
    ports:
      - "127.0.0.1:${SINCRONIZACION_PUERTO:-3020}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  api:
    build:
      context: ..
      dockerfile: despliegue/api.Dockerfile
    image: sincronizacion-api:actual
    restart: unless-stopped
    # Las variables salen del entorno de Dokploy (o de despliegue/.env si se levanta a mano)
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-sincronizacion}
      DB_NAME: ${DB_NAME:-sincronizacion}
      DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET}
      JWT_EXPIRES_ADMIN: ${JWT_EXPIRES_ADMIN:-8h}
      JWT_EXPIRES_OPERADOR: ${JWT_EXPIRES_OPERADOR:-30d}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://proyectosena.online}
      # Un proxy de confianza: el Nginx del servidor, que fija la IP real del cliente
      TRUST_PROXY: "1"
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-1000}
      RATE_LIMIT_LOGIN_MAX: ${RATE_LIMIT_LOGIN_MAX:-10}
      # Crea el esquema si la base está vacía y aplica las migraciones antes de escuchar
      MIGRAR_AL_INICIAR: "true"
    depends_on:
      db:
        condition: service_healthy
    # Sin "ports": solo el contenedor web llega a la API
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # PostgreSQL propio, para no tocar el del servidor ni el de los otros proyectos.
  # El esquema y las migraciones los aplica la API al arrancar (MIGRAR_AL_INICIAR).
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sincronizacion}
      POSTGRES_USER: ${DB_USER:-sincronizacion}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD}
    volumes:
      - datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  # Los datos sobreviven a "docker compose down"; solo "down -v" los borra.
  # Nombre fijo: Dokploy usa su propio nombre de proyecto y, sin esto, crearía una base vacía
  datos:
    name: sincronizacion_datos
